<header class="header" [class.scrolled]="scrolled() || open()" (keydown)="trapFocus($event)">
  <div class="container bar">
    <a routerLink="/" class="brand" aria-label="SoftSpark, ir al inicio">
      <img src="brand/softspark-mark-192.webp" alt="" width="36" height="36" />
      <span class="word">Soft<span>Spark</span></span>
    </a>

    <nav class="nav" aria-label="Principal">
      <ul>
        @for (l of links; track l.path) {
          <li><a [routerLink]="l.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ l.label }}</a></li>
        }
      </ul>
    </nav>

    <div class="actions">
      <app-theme-toggle />
      <a routerLink="/contacto" class="btn btn-contrast btn-sm cta">Solicitar cotización <app-icon name="arrow-right" [size]="15" class="icon-shift" /></a>
      <button
        #toggleBtn
        type="button"
        class="menu-btn"
        aria-controls="menu-movil"
        [attr.aria-expanded]="open()"
        [attr.aria-label]="open() ? 'Cerrar menú' : 'Abrir menú'"
        (click)="toggle()"
      >
        <span class="burger" [class.x]="open()" aria-hidden="true"><span></span><span></span></span>
      </button>
    </div>
  </div>

  <div #panel id="menu-movil" class="panel" [class.open]="open()" [attr.inert]="open() ? null : ''">
    <nav class="container" aria-label="Menú móvil">
      <ul>
        @for (l of mobileLinks; track l.path; let i = $index) {
          <li [style.--i]="i">
            <a [routerLink]="l.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ l.label }} <app-icon name="chevron-right" [size]="18" /></a>
          </li>
        }
      </ul>
      <a routerLink="/contacto" class="btn btn-brand btn-lg">Solicitar cotización <app-icon name="arrow-right" [size]="18" /></a>
    </nav>
  </div>
</header>
